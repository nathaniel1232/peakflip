<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peak Flip · record 16:9</title>
<style>
  /* The CrazyGames build in an exact 16:9 frame, as big as the window allows, on black. Record just the frame. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  iframe { border: 0; display: block; aspect-ratio: 16 / 9; width: min(100vw, calc(100vh * 16 / 9)); }
</style>
</head>
<body>
<iframe src="http://localhost:8125/" allow="autoplay; fullscreen; gamepad" title="Peak Flip"></iframe>
</body>
</html>
