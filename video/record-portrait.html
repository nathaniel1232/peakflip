<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peak Flip · record 2:3</title>
<style>
  /* The CrazyGames build in an exact 2:3 phone-shaped frame, full window height, on black. Record just the frame. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  iframe { border: 0; display: block; aspect-ratio: 2 / 3; height: min(100vh, calc(100vw * 3 / 2)); }
</style>
</head>
<body>
<iframe src="http://localhost:8125/" allow="autoplay; fullscreen; gamepad" title="Peak Flip"></iframe>
</body>
