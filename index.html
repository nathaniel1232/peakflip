<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Peak Flip</title>
<meta name="description" content="Low-poly ski trick game. Flip, spin, grind rails, race the daily forest course against other players' ghosts.">
<meta property="og:title" content="Peak Flip">
<meta property="og:description" content="Flip, spin and grind down an endless mountain. Race your friends on today's course.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0f1c2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1c2e'/%3E%3Cpath d='M8 50 L26 20 L36 34 L44 24 L58 50Z' fill='%23fff'/%3E%3Cpath d='M22 27 L26 20 L30 26 L26 25Z' fill='%23ff6b2c'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: rgba(13, 25, 42, .9); --ink-2: rgba(255,255,255,.07); --ink-3: rgba(255,255,255,.12);
    --text: #fff; --muted: #9db0c6; --accent: #ff6b2c; --accent-2: #e5551a; --ice: #4cc3ff; --gold: #ffc93c; --good: #3ddc84;
    --r: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); user-select: none; -webkit-user-select: none; }
  #game, canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
  .ic { width: 22px; height: 22px; flex: none; }
  .coin { display: inline-block; width: .85em; height: .85em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3bf, var(--gold) 50%, #d99a00); vertical-align: -0.1em; box-shadow: inset 0 -1px 0 rgba(0,0,0,.2); }

  /* ---------- HUD (sits on bright snow, so it keeps a soft shadow) ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 2px rgba(10,30,60,.45); font-weight: 800; }
  #score { position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-size: 40px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  #raceInfo { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); font-size: 14px; background: rgba(13,25,42,.55); padding: 5px 12px; border-radius: 99px; white-space: nowrap; text-shadow: none; font-variant-numeric: tabular-nums; }
  #coins { position: absolute; top: 16px; right: 16px; font-size: 20px; background: rgba(13,25,42,.45); padding: 6px 12px; border-radius: 99px; text-shadow: none; display: flex; gap: 6px; align-items: center; }
  #speedo { position: absolute; bottom: 16px; right: 16px; font-size: 15px; font-variant-numeric: tabular-nums; opacity: .9; }
  #combo { position: absolute; top: 68px; left: 0; right: 0; text-align: center; font-size: 18px; color: var(--gold); }
  #raceInfo:not(.hidden) ~ #combo { top: 98px; }
  #comboBar { width: 110px; height: 4px; margin: 5px auto 0; border-radius: 2px; background: rgba(255,255,255,.35); overflow: hidden; }
  #comboFill { height: 100%; width: 100%; background: var(--gold); }
  #trick { position: absolute; top: 30%; left: 0; right: 0; text-align: center; opacity: 0; }
  #trick.show { animation: pop 1.3s ease-out forwards; }
  #trickName { font-size: 30px; padding: 0 12px; letter-spacing: -.01em; }
  #trickPts { font-size: 22px; color: var(--gold); }
  #trick.perfect #trickName { color: #9bf6ff; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.7); } 12% { opacity: 1; transform: scale(1.06); } 22% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-24px); } }
  #toast { position: absolute; top: 116px; left: 50%; transform: translateX(-50%); background: rgba(13,25,42,.82); border-left: 3px solid var(--good); padding: 8px 14px; border-radius: 10px; font-size: 14px; white-space: nowrap; opacity: 0; text-shadow: none; display: flex; gap: 8px; align-items: center; }
  #toast .ic { color: var(--good); width: 18px; height: 18px; }
  #toast.show { animation: toast 2.1s ease-out forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  #hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 160px); text-align: center; font-size: 13px; font-weight: 600; line-height: 1.9; transition: opacity 1s; background: rgba(13,25,42,.55); padding: 8px 14px; border-radius: 12px; text-shadow: none; }
  #hint kbd { background: rgba(255,255,255,.18); }
  kbd { display: inline-block; min-width: 1.6em; text-align: center; background: rgba(255,255,255,.22); border-radius: 5px; padding: 0 5px; font: 700 12px system-ui, sans-serif; text-shadow: none; }
  .iconBtn { position: fixed; top: 14px; width: 42px; height: 42px; border-radius: 12px; background: rgba(13,25,42,.45); color: #fff; display: grid; place-items: center; pointer-events: auto; z-index: 6; }
  .iconBtn:hover { background: rgba(13,25,42,.65); }
  #pauseBtn { left: 14px; }
  #muteBtn { left: 64px; }
  #camBtn { left: 114px; }

  /* ---------- screens & cards ---------- */
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: linear-gradient(180deg, rgba(13,25,42,.05), rgba(13,25,42,.45)); z-index: 3; overflow-y: auto; }
  .card { width: 100%; max-width: 420px; background: var(--ink); border-radius: 22px; padding: 22px; box-shadow: 0 20px 60px rgba(5,15,30,.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; flex-direction: column; gap: 14px; margin: auto; }
  .logo { display: flex; align-items: center; gap: 10px; justify-content: center; }
  .logo .ic { width: 36px; height: 36px; color: var(--accent); }
  .logo b { font-size: 34px; letter-spacing: -.03em; font-weight: 900; }
  .chips { display: flex; gap: 8px; justify-content: center; }
  .chip { background: var(--ink-2); border-radius: 99px; padding: 6px 12px; font-size: 14px; font-weight: 700; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .chip b { color: var(--text); font-variant-numeric: tabular-nums; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: var(--r); padding: 14px 18px; font-weight: 800; font-size: 17px; background: var(--ink-3); transition: transform .08s, background .15s; }
  .btn:hover { background: rgba(255,255,255,.17); }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.big { font-size: 20px; padding: 16px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .mode { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border-radius: var(--r); background: var(--ink-3); transition: transform .08s, background .15s; }
  .mode:hover { background: rgba(255,255,255,.17); }
  .mode:active { transform: scale(.98); }
  .mode.primary { background: var(--accent); }
  .mode.primary:hover { background: var(--accent-2); }
  .mode .ic { width: 26px; height: 26px; }
  .mode .t { font-size: 19px; font-weight: 800; display: block; }
  .mode .s { font-size: 13px; opacity: .8; display: block; margin-top: 1px; }
  .mode .go { opacity: .7; width: 18px; height: 18px; }
  .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .nav button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 4px 10px; border-radius: var(--r); background: var(--ink-2); font-size: 12px; font-weight: 700; color: var(--muted); transition: background .15s; }
  .nav button:hover { background: var(--ink-3); color: var(--text); }
  .nav button .ic { color: var(--text); }
  .nav small { font-size: 11px; font-weight: 600; opacity: .8; }
  .dot { position: absolute; top: 8px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #13253b; }
  .controls { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.9; }
  .controls kbd { background: var(--ink-3); color: var(--text); }
  h2 { margin: 0; font-size: 30px; letter-spacing: -.02em; text-align: center; }
  .sub { color: var(--muted); font-size: 14px; text-align: center; margin-top: -8px; }
  .big-num { text-align: center; font-size: 52px; font-weight: 900; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .big-num small { display: block; font-size: 12px; color: var(--muted); letter-spacing: .08em; font-weight: 700; margin-bottom: 4px; }
  .tag { align-self: center; background: var(--accent); border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 800; letter-spacing: .06em; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; align-items: center; gap: 10px; background: var(--ink-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 600; }
  .item .grow { flex: 1; }
  .item .val { font-weight: 800; font-variant-numeric: tabular-nums; }
  .item.me { background: rgba(255,107,44,.22); }
  .item .rank { width: 22px; color: var(--muted); font-weight: 800; }
  .item .ic { width: 18px; height: 18px; color: var(--good); }
  .earn { display: flex; justify-content: space-between; align-items: center; background: var(--ink-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
  .earn b { color: var(--text); font-size: 18px; }
  .note { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }
  .note b { color: var(--text); }
  .nameRow { display: flex; gap: 6px; }
  .nameRow input { flex: 1; min-width: 0; border: 0; border-radius: 12px; padding: 12px; font: 700 15px system-ui, sans-serif; background: #fff; color: #0f1c2e; }

  /* ---------- panel ---------- */
  #panel { position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(8,18,32,.5); }
  #panel .card { max-height: 92vh; overflow-y: auto; }
  #panel.wide .card { max-width: 600px; }
  .head { display: flex; justify-content: space-between; align-items: center; }
  #panelTitle { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  #panelClose { width: 36px; height: 36px; border-radius: 10px; background: var(--ink-2); display: grid; place-items: center; }
  .tabs { display: flex; gap: 4px; background: var(--ink-2); border-radius: 12px; padding: 4px; }
  .tab { flex: 1; border-radius: 9px; padding: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .tab.on { background: var(--ink-3); color: var(--text); }
  .chestRow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (max-width: 540px) { .chestRow { grid-template-columns: 1fr; } }
  .chestCard { background: var(--ink-2); border-radius: var(--r); padding: 14px 10px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .cname { font-size: 15px; font-weight: 800; }
  .odds { font-size: 11px; font-weight: 700; line-height: 1.5; }
  .odds span { display: inline-block; margin: 0 3px; }
  .chestCard .btn { width: 100%; padding: 10px; font-size: 14px; }
  .btn.go { background: var(--good); color: #062a14; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .skin { border-radius: 12px; background: var(--ink-2); padding: 10px 4px 8px; text-align: center; box-shadow: inset 0 0 0 2px transparent; transition: background .15s; }
  .skin:hover:not(:disabled) { background: var(--ink-3); }
  .skin.sel { box-shadow: inset 0 0 0 2px var(--accent); background: rgba(255,107,44,.14); }
  .skin:disabled { cursor: default; }
  .skin .nm { font-size: 12px; font-weight: 700; margin-top: 6px; }
  .skin .rr { font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .sw { width: 44px; height: 44px; margin: 0 auto; border-radius: 11px; position: relative; overflow: hidden; }
  .sw i { position: absolute; left: 0; right: 0; bottom: 0; height: 38%; }
  .sw b { position: absolute; left: 30%; right: 30%; top: 0; height: 22%; border-radius: 0 0 6px 6px; }
  .sw.ski { background: var(--ink-2); }
  .sw.ski i { width: 8px; height: 38px; top: 3px; bottom: auto; border-radius: 5px 5px 2px 2px; }
  .sw.ski i:first-child { left: 12px; right: auto; } .sw.ski i:nth-child(2) { left: 24px; right: auto; }
  .sw.ski em { position: absolute; left: 12px; width: 20px; top: 3px; height: 5px; border-radius: 4px; }
  .sw.trail { background: var(--ink-2); }
  .sw.trail i { height: 8px; top: 18px; border-radius: 6px; }
  .sw.trail span { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .sw.q { background: var(--ink-2); display: grid; place-items: center; color: var(--muted); }
  .sw.q .ic { width: 18px; height: 18px; }

  /* ---------- chest art (CSS, no images) ---------- */
  .chest { position: relative; width: 64px; height: 52px; }
  .chest .base { position: absolute; bottom: 0; left: 0; right: 0; height: 60%; background: var(--c); border-radius: 3px 3px 8px 8px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.22); }
  .chest .lid { position: absolute; top: 0; left: -2px; right: -2px; height: 44%; background: var(--c); border-radius: 16px 16px 3px 3px; filter: brightness(1.18); transform-origin: 10% 100%; }
  .chest .base::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: rgba(0,0,0,.18); }
  .chest .base::after { content: ''; position: absolute; left: 50%; top: -5px; width: 12px; height: 14px; margin-left: -6px; background: var(--gold); border-radius: 3px; }
  .chest.big { width: 150px; height: 120px; }
  #chestOpen { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(6,12,24,.93); }
  .shaking { animation: shake .12s linear infinite; }
  .shaking.glowing { filter: drop-shadow(0 0 18px var(--glow)) drop-shadow(0 0 36px var(--glow)); animation-duration: .07s; }
  @keyframes shake { 0% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-3px); } 100% { transform: rotate(-4deg); } }
  .tapHint { font-size: 14px; color: var(--muted); }
  .burst { position: absolute; width: 440px; height: 440px; border-radius: 50%; background: radial-gradient(circle, var(--glow), transparent 65%); opacity: .4; animation: burst 1.2s ease-out; pointer-events: none; }
  @keyframes burst { from { transform: scale(.2); opacity: .9; } to { transform: scale(1); opacity: .4; } }
  .reveal { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; animation: rise .5s cubic-bezier(.2,1.5,.4,1); }
  @keyframes rise { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .rar { font-size: 13px; font-weight: 800; letter-spacing: .2em; }
  .bigSw .sw { transform: scale(2.3); margin: 32px; box-shadow: 0 0 18px var(--glow); }
  .iname { font-size: 30px; font-weight: 900; letter-spacing: -.02em; }
  .ikind { font-size: 13px; color: var(--muted); }
  .newTag { background: var(--accent); border-radius: 99px; padding: 3px 12px; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
  .dupe { font-size: 14px; color: var(--gold); font-weight: 700; }
  .reveal .row { margin-top: 10px; min-width: 260px; }

  /* ---------- optional side ad rails (web hosting only) ---------- */
  .adrail { position: fixed; top: 50%; transform: translateY(-50%); width: 160px; min-height: 600px; z-index: 2; display: none; }
  .adrail.left { left: 8px; } .adrail.right { right: 8px; }
  @media (min-width: 1280px) { body.ads-on .adrail { display: block; } }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" class="hidden">
  <div id="score">0</div>
  <div id="raceInfo" class="hidden"></div>
  <div id="coins"><span class="coin"></span><span id="coinCount">0</span></div>
  <div id="combo" class="hidden"><span id="comboText"></span><div id="comboBar"><div id="comboFill"></div></div></div>
  <div id="trick"><div id="trickName"></div><div id="trickPts"></div></div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="speedo"></div>
  <button id="pauseBtn" class="iconBtn" aria-label="Pause"></button>
  <button id="camBtn" class="iconBtn" aria-label="Change camera"></button>
</div>

<div id="menu" class="screen">
  <div class="card">
    <div class="logo"><span id="logoIc"></span><b>Peak Flip</b></div>
    <div class="chips">
      <div class="chip">Best <b id="menuBest">0</b></div>
      <div class="chip"><span class="coin"></span><b id="menuCoins">0</b></div>
    </div>
    <button id="playBtn" class="mode primary"><span id="icPlay"></span><span><span class="t">Endless</span><span class="s">Tricks, speed, how far can you go</span></span><span id="icGo1"></span></button>
    <button id="raceBtn" class="mode"><span id="icFlag"></span><span><span class="t">Daily Race</span><span class="s" id="raceSub"></span></span><span id="icGo2"></span></button>
    <div class="nav">
      <button id="chestsBtn"><span id="icChest"></span>Chests<small id="chestSub">&nbsp;</small><span id="chestBadge" class="dot hidden"></span></button>
      <button id="lockerBtn"><span id="icSkis"></span>Locker<small id="lockerSub"></small></button>
      <button id="missionsBtn"><span id="icTarget"></span>Missions<small id="missionSub"></small></button>
      <button id="lbBtn"><span id="icTrophy"></span>Ranks<small>Leaderboard</small></button>
    </div>
    <div class="controls" id="menuControls"></div>
  </div>
</div>

<div id="over" class="screen hidden"></div>

<div id="pause" class="screen hidden">
  <div class="card">
    <h2>Paused</h2>
    <button id="resumeBtn" class="btn primary big">Resume</button>
    <button id="quitBtn" class="btn">Quit to menu</button>
  </div>
</div>

<div id="panel" class="hidden"><div class="card">
  <div class="head"><div id="panelTitle"></div><button id="panelClose" aria-label="Close"></button></div>
  <div id="panelBody" style="display:flex;flex-direction:column;gap:12px"></div>
</div></div>
<div id="chestOpen" class="hidden"></div>

<aside class="adrail left" id="adLeft"></aside>
<aside class="adrail right" id="adRight"></aside>

<button id="muteBtn" class="iconBtn" aria-label="Sound"></button>

<script src="config.js"></script>
<script type="module" src="game.js"></script>
<script>
  // Optional side ads when self-hosted (never on CrazyGames, which forbids third-party ads).
  (function () {
    var c = window.PEAKFLIP_CONFIG || {};
    if (!c.adsenseClient || /crazygames/.test(location.hostname)) return;
    document.body.classList.add('ads-on');
    var s = document.createElement('script');
    s.async = true; s.crossOrigin = 'anonymous';
    s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + c.adsenseClient;
    document.head.appendChild(s);
    [['adLeft', c.adsenseSlotLeft], ['adRight', c.adsenseSlotRight]].forEach(function (a) {
      if (!a[1]) return;
      document.getElementById(a[0]).innerHTML = '<ins class="adsbygoogle" style="display:block;width:160px;height:600px" data-ad-client="' + c.adsenseClient + '" data-ad-slot="' + a[1] + '"></ins>';
      (window.adsbygoogle = window.adsbygoogle || []).push({});
    });
  })();
</script>
</body>
</html>
