<style>
  :root {
    --ink: rgba(13, 25, 42, .9); --ink-2: rgba(255,255,255,.07); --ink-3: rgba(255,255,255,.12);
    --text: #fff; --muted: #9db0c6; --accent: #ff6b2c; --accent-2: #e5551a; --ice: #4cc3ff; --gold: #ffc93c; --good: #3ddc84;
    --r: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); user-select: none; -webkit-user-select: none; }
  #game, canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  #fade { position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0; background: #000; }

  @keyframes hurt { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
  /* ---------- HUD (sits on bright snow, so it keeps a soft shadow) ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 2px rgba(10,30,60,.45); font-weight: 800; }

  #raceInfo { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); font-size: 14px; background: rgba(13,25,42,.55); padding: 5px 12px; border-radius: 99px; white-space: nowrap; text-shadow: none; font-variant-numeric: tabular-nums; }

  #speedo { position: absolute; bottom: 16px; right: 16px; font-size: 15px; font-variant-numeric: tabular-nums; opacity: .9; }
  #combo { position: absolute; top: 68px; left: 0; right: 0; text-align: center; font-size: 18px; color: var(--gold); }

  #comboFill { height: 100%; width: 100%; background: var(--gold); }
  /* trick names and points pop up low on the screen, under the rider, where they don't block the view ahead */

  @keyframes pop { 0% { opacity: 0; transform: scale(.7); } 12% { opacity: 1; transform: scale(1.06); } 22% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-24px); } }
  #toast { position: absolute; top: 116px; left: 50%; transform: translateX(-50%); background: rgba(13,25,42,.82); border-left: 3px solid var(--good); padding: 8px 14px; border-radius: 10px; font-size: 14px; white-space: nowrap; opacity: 0; text-shadow: none; display: flex; gap: 8px; align-items: center; }
  #toast .ic { color: var(--good); width: 18px; height: 18px; }

  #hint kbd { background: rgba(255,255,255,.18); }

  .iconBtn { position: fixed; top: 14px; width: 42px; height: 42px; border-radius: 12px; background: rgba(13,25,42,.45); color: #fff; display: grid; place-items: center; pointer-events: auto; z-index: 6; }
  .iconBtn:hover { background: rgba(13,25,42,.65); }

  /* ---------- touch controls (phones/tablets only) ---------- */

    transform: translate(28px, calc(100vh - 150px)); opacity: .45; transition: opacity .15s; }

  /* ---------- screens & cards ---------- */

  .mode { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border-radius: var(--r); background: var(--ink-3); transition: transform .08s, background .15s; }
  .mode:hover { background: rgba(255,255,255,.17); }

  .mode.primary:hover { background: var(--accent-2); }

  .nav small { color: var(--muted); }

  .menuWrap { display: flex; gap: 14px; align-items: stretch; justify-content: center; width: 100%; max-width: 860px; margin: auto; }

  @media (max-width: 760px) { .menuWrap { flex-direction: column; align-items: center; } .lbCard { max-width: 420px; } }
  .topRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  @media (max-width: 400px) { .topRow .logo b { font-size: 23px; } .topRow .logo .ic { width: 28px; height: 28px; } .profile { max-width: 140px; } }
  .profile { display: flex; align-items: center; gap: 6px; background: var(--ink-2); border-radius: 99px; padding: 6px 12px 6px 8px; font-size: 13px; font-weight: 700; color: var(--muted); max-width: 170px; }

  .newPill { font-style: normal; font-size: 10px; font-weight: 900; letter-spacing: .08em; background: var(--gold); color: #2a1a00; border-radius: 99px; padding: 2px 7px; vertical-align: 3px; margin-left: 4px; }
  .lbTop { display: flex; flex-direction: column; gap: 10px; }
  .lbTitle { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 900; letter-spacing: -.02em; }
  .lbTitle .ic { color: var(--gold); width: 24px; height: 24px; }
  .tabs.mini .tab { padding: 6px; font-size: 12px; }

  .lbPeriods { margin-top: -6px; }
  .lbPeriods .tab { padding: 6px; font-size: 12px; }

  .rowTime { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item.first { background: linear-gradient(90deg, rgba(255,201,60,.19), rgba(255,255,255,.07)); box-shadow: inset 0 0 0 1px rgba(255,201,60,.24); }
  .item.first .rank .ic { color: var(--gold); fill: rgba(255,201,60,.22); }

  .row { display: flex; gap: 8px; }

  .btnGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(86px, 1fr)); }

  .btnGrid .btn .ic { width: 18px; height: 18px; }
  .list { display: flex; flex-direction: column; gap: 6px; }

  .item .ic { width: 18px; height: 18px; color: var(--good); }
  .earn { display: flex; justify-content: space-between; align-items: center; background: var(--ink-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
  .earn b { color: var(--text); font-size: 18px; }

  .note b { color: var(--text); }
  .nameRow { display: flex; gap: 6px; }
  .nameChip { align-self: center; display: flex; align-items: center; gap: 10px; background: var(--ink-2); border-radius: 99px; padding: 5px 5px 5px 14px; font-size: 14px; font-weight: 700; color: var(--muted); }

  /* ---------- home: snowy text over the attract-mode run ---------- */
  #menu { display: block; padding: 0; background:
      radial-gradient(ellipse 40% 60% at 50% 32%, rgba(10,32,64,.32), transparent 70%),
      linear-gradient(90deg, transparent 70%, rgba(10,32,64,.42)),
      linear-gradient(180deg, rgba(10,32,64,.18), transparent 30%); }
  /* the main menu sits in the middle; the leaderboard keeps the right-hand column */
  .home { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; min-height: 100%; padding: max(28px, env(safe-area-inset-top)) clamp(18px, 4vw, 56px) 28px; }
  .homeLeft, .homeRight { display: flex; flex-direction: column; gap: 14px; }
  .homeLeft { grid-column: 2; align-items: center; text-align: center; }
  .homeRight { grid-column: 3; justify-self: end; align-items: flex-end; width: min(340px, 26vw); }
  .snowy {
    --ice1: #d9f1ff; --ice2: #8fc8ee; --ice3: #4a8fc4;
    position: relative; display: inline-block; font-family: 'Lilita One', system-ui, sans-serif; font-weight: 400; color: #cfe8fa; line-height: 1; letter-spacing: .01em;
    white-space: nowrap;
    text-shadow: 0 1px 0 var(--ice1), 0 2px 0 var(--ice2), 0 3px 0 var(--ice2), 0 4px 0 var(--ice3), 0 5px 0 var(--ice3), 0 8px 14px rgba(8,30,62,.45), 0 0 22px rgba(160,220,255,.35);
  }
  /* a drift of fresh snow sitting on top of each letter, with little drips */
  .snowy::after {
    content: attr(data-text); position: absolute; left: 0; top: 0; color: #fff; text-shadow: none;
    clip-path: polygon(0 0, 100% 0, 100% 34%, 94% 40%, 88% 33%, 81% 44%, 74% 35%, 66% 41%, 59% 32%, 52% 46%, 45% 36%, 38% 42%, 31% 33%, 24% 45%, 17% 36%, 10% 42%, 4% 34%, 0 40%);
    pointer-events: none;
  }
  .brand { margin: 0; display: flex; align-items: baseline; gap: 2px; }
  .brand { cursor: pointer; }
  .brand.flip { animation: titleFlip .6s cubic-bezier(.3,1.4,.5,1); }
  @keyframes titleFlip { from { transform: rotateX(360deg) scale(.9); } }
  .brand > .snowy { font-size: clamp(44px, 6.4vw, 92px); }
  .brand small.snowy { font-size: clamp(26px, 3.4vw, 50px); }
  .brand #logoIc .ic { width: clamp(30px, 4vw, 56px); height: clamp(30px, 4vw, 56px); color: #fff; filter: drop-shadow(0 3px 0 #4a8fc4); margin-right: 8px; align-self: center; }
  .homeStats { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .homeStats .chip, .homeStats .profile { background: rgba(10,32,64,.62); color: #d6e9fb;  }
  .homeStats .profile.claim { background: rgba(76,195,255,.45); color: #fff; animation: claimPulse 2s ease-in-out infinite; }
  @keyframes claimPulse { 50% { box-shadow: 0 0 0 4px rgba(76,195,255,.3); } }
  .homeNav { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.4vh, 14px); margin-top: 1vh; }
  .homeNav .hl { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .homeNav .hl > span:first-child:not(.snowy) { display: none; }
  .homeNav .hl small { margin-top: 6px; line-height: 1.2; position: relative; z-index: 1; }
  .homeRow { display: flex; justify-content: center; align-items: flex-start; gap: clamp(14px, 3vw, 44px); }
  .homeRow .hl small { max-width: 16em; }
  .levelGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .lvl { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 16px; text-align: left; color: #fff;
    background: linear-gradient(160deg, var(--a), var(--b)); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 4px 12px rgba(0,0,0,.25); transition: transform .15s; }
  .lvl:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); }
  .lvl:disabled { filter: grayscale(.8) brightness(.6); cursor: default; }
  .lvl .num { font-size: 12px; font-weight: 800; letter-spacing: .08em; opacity: .9; }
  .diff { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 10px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: #fff; vertical-align: 1px; }
  .diff.easy { background: #2a9d4f; } .diff.medium { background: #e08a00; } .diff.hard { background: #d62839; box-shadow: 0 0 0 1px rgba(255,255,255,.5); }
  .lvl .name { font-size: 17px; font-weight: 900; line-height: 1.1; }
  .lvl .meta { font-size: 12px; font-weight: 700; opacity: .85; }
  .lvl .ic { position: absolute; top: 10px; right: 10px; width: 18px; height: 18px; }
  .stars { font-size: 20px; letter-spacing: 2px; color: rgba(255,255,255,.28); text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .stars b { color: #ffd23f; font-weight: 400; }
  .bigStars { font-size: 54px; letter-spacing: 8px; text-align: center; line-height: 1; }
  .bigStars b { display: inline-block; animation: starPop .5s cubic-bezier(.2,1.8,.4,1) both; }
  .bigStars b:nth-child(2) { animation-delay: .25s; } .bigStars b:nth-child(3) { animation-delay: .5s; }
  @keyframes starPop { from { transform: scale(0) rotate(-90deg); } }
  .homeNav .hl .snowy { line-height: .95; }

  .tab { font-size: 14px; }
  .tab.on { background: rgba(255,255,255,.18); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
  .item { background: rgba(255,255,255,.08); }
  .item.me { background: rgba(255,140,70,.28); }
  .earn { background: rgba(255,255,255,.08); }
  .earn b { font-family: var(--snow-font); font-weight: 400; font-size: 20px; }
  #panel .head { margin-bottom: 2px; }
  #pause, #over { background: linear-gradient(180deg, rgba(10,32,64,.25), rgba(10,32,64,.6)); }
  #toast { font-family: var(--snow-font); font-weight: 400; letter-spacing: .02em; }

  /* ---------- item shop: daily rotation cards ---------- */
  .shopTop { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .giftBar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.08); font-family: var(--snow-font); font-size: 16px; text-align: left; }
  .giftBar span { flex: 1; } .giftBar .ic { width: 24px; height: 24px; color: var(--gold); }
  .giftBar.ready { background: linear-gradient(90deg, #ff8a4c, #ffc93c); color: #2a1500; animation: claimPulse 2s ease-in-out infinite; }
  .giftBar.ready .ic { color: #2a1500; }
  .giftBar:disabled { opacity: .75; cursor: default; }
  .offers { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .offers.featured { grid-template-columns: 1fr 1fr; }
  .offer { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px 10px; border-radius: 16px; text-align: center; overflow: hidden;
    background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 38%, #102544), #0b1a33 85%); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--rc) 55%, transparent); transition: transform .12s; }
  .offer:hover { transform: translateY(-2px); }
  .offer.sel { box-shadow: inset 0 0 0 3px var(--ice), 0 0 18px rgba(76,195,255,.4); }
  .offer.big { padding: 22px 10px 14px; }
  .offer.big .offerArt .sw { transform: scale(1.7); margin: 22px auto; }
  .offerArt .sw { transform: scale(1.15); margin: 8px auto; }
  .offerName { font-family: var(--snow-font); font-size: 16px; line-height: 1.1; }
  .offer.big .offerName { font-size: 22px; }
  .offerKind { font-size: 11px; font-weight: 700; color: var(--rc); }
  .offerPrice { margin-top: 4px; font-family: var(--snow-font); font-size: 16px; display: flex; gap: 4px; align-items: center; }
  .offerPrice s { color: var(--muted); font-size: 13px; }
  .offerPrice .ic { width: 15px; height: 15px; color: var(--good); }
  .offer.owned { opacity: .62; }
  .offerTag { position: absolute; top: 6px; left: 6px; font-size: 9px; font-weight: 900; letter-spacing: .08em; padding: 2px 7px; border-radius: 99px; background: var(--accent); }
  .offerTag.lim { background: linear-gradient(90deg, #ffd23f, #ff7b00); color: #2a1500; }
  .bundle { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 30%, #102544), #0b1a33 70%); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 45%, transparent); }
  .bundleHead { display: flex; justify-content: space-between; align-items: baseline; } .bundleHead b { font-family: var(--snow-font); font-size: 20px; font-weight: 400; } .bundleHead span { font-size: 12px; color: var(--muted); }
  .bundle .btn s { opacity: .6; font-size: 13px; }

  /* ---------- 3D item pictures and whole-outfit cards ---------- */
  .thumb { display: block; width: 64px; height: 64px; margin: 0 auto; object-fit: contain; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .thumb.ready { opacity: 1; }
  .offer .thumb { width: 96px; height: 96px; }
  .offer.big .thumb { width: 150px; height: 150px; }
  .offerArt { min-height: 96px; display: grid; place-items: center; background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--rc) 35%, transparent), transparent 70%); border-radius: 12px; width: 100%; }
  .fp .thumb { width: 40px; height: 40px; }
  .fp { background: rgba(255,255,255,.07); border-radius: 10px; padding: 2px; }
  .skin .thumb { width: 64px; height: 64px; }
  .looks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .look { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 10px; border-radius: 16px; text-align: center;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 35%, #102544), #0b1a33 80%); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 50%, transparent); }
  .lookArt { width: 100%; display: grid; place-items: center; background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--c) 40%, transparent), transparent 70%); border-radius: 12px; }
  .look .thumb { width: 150px; height: 150px; }
  .look .row { width: 100%; margin-top: 4px; } .look .btn { padding: 9px 6px; font-size: 14px; } .look .btn s { opacity: .6; font-size: 12px; }

  /* the shop's buy bar sticks to the bottom of the panel */
  .buyDock { position: sticky; bottom: -22px; z-index: 3; margin: 4px -22px -22px; padding: 12px 16px 14px; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, #1d3d6b, #10264a); border-top: 1px solid rgba(190,228,255,.28); box-shadow: 0 -10px 24px rgba(5,15,30,.45); border-radius: 0 0 22px 22px; }
  .buyDock .thumb, .buyDock .sw { width: 58px; height: 58px; margin: 0; flex: none; border-radius: 12px; background: radial-gradient(circle at 50% 55%, rgba(220,240,255,.45), rgba(220,240,255,.08) 70%); }
  .buyDock span { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .buyDock b { font-family: var(--snow-font); font-weight: 400; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .buyDock small { font-size: 12px; color: var(--muted); }
  .buyDock .btn { padding: 11px 14px; font-size: 16px; white-space: nowrap; }
  .buyDock .btn.go { animation: claimPulse 2s ease-in-out infinite; }
  @media (max-width: 480px) { .buyDock { gap: 8px; padding: 10px 10px 12px; } .buyDock .thumb { width: 44px; height: 44px; } .buyDock .btn { padding: 10px 10px; font-size: 14px; } }
  /* ---------- optional side ad rails (web hosting only) ---------- */
  .adrail { position: fixed; top: 50%; transform: translateY(-50%); width: 160px; min-height: 600px; z-index: 2; display: none; }
  .adrail.left { left: 8px; } .adrail.right { right: 8px; }
  @media (min-width: 1280px) { body.ads-on .adrail { display: block; } }
</style>
</head>
<body>
<div id="game"></div>

<div id="hurt"></div>
<div id="fade"></div>
<div id="hud" class="hidden">
  <div id="score">0</div>
  <div id="raceInfo" class="hidden"></div>
  <div id="coins"><span class="coin"></span><span id="coinCount">0</span></div>
  <div id="combo" class="hidden"><span id="comboText"></span><div id="comboBar"><div id="comboFill"></div></div></div>
  <div id="trick"><div id="trickName"></div><div id="trickPts"></div></div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="speedo"></div>
  <div id="tStick"><div id="tKnob"></div></div>
  <div id="tJump"><b>JUMP</b><small>hold = grab</small></div>
  <button id="pauseBtn" class="iconBtn" aria-label="Pause"></button>
  <button id="camBtn" class="iconBtn" aria-label="Change camera"></button>
</div>

<div id="menu" class="screen">
  <div class="home">
    <section class="homeLeft">
      <h1 class="brand"><span id="logoIc"></span><span class="snowy" data-text="PEAKFLIP">PEAKFLIP</span><small class="snowy" data-text=".io">.io</small></h1>
      <div class="homeStats">
        <button id="profileBtn" class="profile"></button>
        <div class="chip">Best <b id="menuBest">0</b></div>
        <div class="chip"><span class="coin"></span><b id="menuCoins">0</b></div>
      </div>
      <nav class="homeNav">
        <button id="playBtn" class="hl play"><span id="icPlay"></span><span class="snowy" data-text="play">play</span><small>Endless · tricks, speed, distance</small><span id="icGo1" hidden></span></button>
        <div class="homeRow">
          <button id="raceBtn" class="hl"><span id="icFlag"></span><span class="snowy" data-text="race">race</span><small id="raceSub"></small><span id="icGo2" hidden></span></button>
          <button id="levelsBtn" class="hl"><span id="icLevels"></span><span class="snowy" data-text="levels">levels</span><small id="levelsSub"></small></button>
        </div>
        <button id="lockerBtn" class="hl"><span id="icSkis"></span><span class="snowy" data-text="locker">locker</span><small id="lockerSub"></small></button>
        <button id="shopBtn" class="hl"><span id="icShop"></span><span class="snowy" data-text="shop">shop</span><small id="shopSub">&nbsp;</small><span id="chestBadge" class="dot hidden"></span></button>
      </nav>
      <div class="homeMinor">
        <button id="missionsBtn"><span id="icTarget"></span>Missions <small id="missionSub"></small></button>
        <button id="helpBtn"><span id="icHelp"></span>How to play</button>
        <button id="settingsBtn"><span id="icGear"></span>Settings</button>
      </div>
    </section>
    <section class="homeRight">
      <button id="lbBtn" class="lbHead"><span id="icTrophy"></span><span class="snowy" data-text="leaderboard">leaderboard</span></button>
      <div class="lbTabs">
        <div class="tabs mini"><button class="tab on" data-mlb="endless">Endless</button><button class="tab" data-mlb="race">Today's race</button></div>
        <div class="tabs mini lbPeriods miniPeriod"><button class="tab on" data-ml-period="all">All time</button><button class="tab" data-ml-period="weekly">Weekly</button><button class="tab" data-ml-period="daily">Daily</button></div>
      </div>
      <div id="miniLb" class="list"><div class="note">Loading…</div></div>
      <button id="miniMore" class="miniMore">see more ›</button>
      <div class="lbFoot">
        <button id="globalChatBtn" class="btn">Global chat</button>
      </div>
    </section>
  </div>
  <div class="spaceHint">Press <kbd>Space</kbd> to ride</div>
</div>

<div id="over" class="screen hidden"></div>

<div id="pause" class="screen hidden">
  <div class="card">
    <h2><span class="snowy" data-text="Paused">Paused</span></h2>
    <button id="resumeBtn" class="btn primary big">Resume</button>
    <button id="quitBtn" class="btn">Quit to menu</button>
  </div>
</div>

<div id="panel" class="hidden"><div class="card">
  <div class="head"><div id="panelTitle" class="snowy"></div><button id="panelClose" aria-label="Close"></button></div>
  <div id="panelBody" style="display:flex;flex-direction:column;gap:12px"></div>
</div></div>

<aside class="adrail left" id="adLeft"></aside>
<aside class="adrail right" id="adRight"></aside>

<button id="muteBtn" class="iconBtn" aria-label="Sound"></button>
<button id="musicBtn" class="iconBtn" aria-label="Music"></button>

<script src="config.js"></script>
<script>
  // Vercel Web Analytics (static-site version of @vercel/analytics). Only loads on the Vercel deployment,
  // so localhost and the CrazyGames build don't request a script that isn't there.
  (function () {
    if (/^(localhost|127\.0\.0\.1|\[::1\])$|crazygames/.test(location.hostname) || location.protocol === 'file:') return;
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    var s = document.createElement('script');
    s.defer = true; s.src = '/_vercel/insights/script.js';
    document.head.appendChild(s);
  })();
</script>
<script type="module" src="game.js"></script>
<script>
  // Optional side ads when self-hosted (never on CrazyGames, which forbids third-party ads).
  (function () {
    var c = window.PEAKFLIP_CONFIG || {};
    if (!c.adsenseClient || /crazygames/.test(location.hostname)) return;
    if (c.adsenseSlotLeft || c.adsenseSlotRight) document.body.classList.add('ads-on');
    if (!document.querySelector('script[src*="adsbygoogle.js"]')) {
      var s = document.createElement('script');
      s.async = true; s.crossOrigin = 'anonymous';
      s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + c.adsenseClient;
      document.head.appendChild(s);
    }
    [['adLeft', c.adsenseSlotLeft], ['adRight', c.adsenseSlotRight]].forEach(function (a) {
      if (!a[1]) return;
      document.getElementById(a[0]).innerHTML = '<ins class="adsbygoogle" style="display:block;width:160px;height:600px" data-ad-client="' + c.adsenseClient + '" data-ad-slot="' + a[1] + '"></ins>';
      (window.adsbygoogle = window.adsbygoogle || []).push({});
    });
  })();
</script>
</body>
</html>
